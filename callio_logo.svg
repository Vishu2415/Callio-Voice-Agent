<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" width="240" height="68">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B4A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Pill Container -->
  <rect x="2" y="2" width="236" height="64" rx="32" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Audio Wave / Telephony Icon -->
  <g transform="translate(20, 14)">
    <circle cx="20" cy="20" r="16" fill="rgba(255,255,255,0.18)" />
    <!-- Waveform bars -->
    <rect x="10" y="16" width="3.5" height="8" rx="1.75" fill="#ffffff" />
    <rect x="15.5" y="11" width="3.5" height="18" rx="1.75" fill="#ffffff" />
    <rect x="21" y="7" width="3.5" height="26" rx="1.75" fill="#ffffff" />
    <rect x="26.5" y="13" width="3.5" height="14" rx="1.75" fill="#ffffff" />
  </g>

  <!-- Callio Typography -->
  <text x="68" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="-0.4">Callio</text>
</svg>
